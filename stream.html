<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Watch SteamPirateTJ live on Twitch and chat right here.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Live Stream | SteamPirateTJ">
  <meta property="og:description" content="Watch SteamPirateTJ live on Twitch and chat right here.">
  <meta property="og:image" content="https://steampiratetj.github.io/SteamPirateTJ/banner.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9A%99%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <title>Live Stream | SteamPirateTJ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">SteamPirateTJ</a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-links"><i class="fas fa-bars"></i></button>
    <div class="nav-links" id="nav-links">
      <a href="index.html">Home</a>
      <a href="merch.html">Merch</a>
      <a href="gallery.html">Art</a>
      <a href="stream.html" class="active">Stream</a>
      <a href="creators.html">Allies</a>
    </div>
  </nav>

  <section class="section page-section">
    <h2>Live Stream</h2>
    <p class="section-desc">Watch & chat right here</p>

    <div class="stream-switcher">
      <button class="stream-arrow" id="stream-prev" aria-label="Previous stream"><i class="fas fa-chevron-left"></i></button>
      <div class="stream-info">
        <span class="stream-label">Now showing</span>
        <span class="stream-name" id="stream-name" aria-live="polite"></span>
        <div class="stream-dots" id="stream-dots"></div>
      </div>
      <button class="stream-arrow" id="stream-next" aria-label="Next stream"><i class="fas fa-chevron-right"></i></button>
    </div>

    <div class="twitch-container">
      <div class="twitch-player">
        <iframe id="twitch-player" title="Twitch stream" height="100%" width="100%" allowfullscreen></iframe>
      </div>
      <div class="twitch-chat">
        <iframe id="twitch-chat" title="Twitch chat" height="100%" width="100%"></iframe>
      </div>
    </div>

    <div class="stream-actions">
      <a id="stream-link" class="stream-link" href="#" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-twitch"></i> <span id="stream-link-text">Watch on Twitch</span>
      </a>
      <p class="stream-note">Offline right now? Follow on Twitch to get notified when the pirate goes live.</p>
    </div>
  </section>

  <footer>
    <p>© <span id="year"></span> SteamPirateTJ • Cherenkov Corsair</p>
    <p>Built with gears, steam & Cherenkov radiation</p>
  </footer>

  <script src="script.js"></script>
  <script>
    // Streams in order. The first one opens first.
    const CHANNELS = ["CaptnSiege", "SteamPirateTJ", "AdrestiaVT", "Hagsparkles", "GoodBoyJackVT", "RebornVT", "MysteryboxVT", "AssassinAngel888", "USCitizen712"];

    let index = 0;
    const parent = location.hostname;
    const player = document.getElementById("twitch-player");
    const chat = document.getElementById("twitch-chat");
    const nameEl = document.getElementById("stream-name");
    const linkEl = document.getElementById("stream-link");
    const linkText = document.getElementById("stream-link-text");
    const dotsEl = document.getElementById("stream-dots");

    // Build the dots
    CHANNELS.forEach((channel, i) => {
      const dot = document.createElement("button");
      dot.className = "stream-dot";
      dot.setAttribute("aria-label", "Show " + channel);
      dot.addEventListener("click", () => { index = i; render(); });
      dotsEl.appendChild(dot);
    });

    function render() {
      const channel = CHANNELS[index];
      player.src = "https://player.twitch.tv/?channel=" + channel + "&parent=" + parent;
      chat.src = "https://www.twitch.tv/embed/" + channel + "/chat?parent=" + parent;
      nameEl.textContent = channel;
      linkEl.href = "https://twitch.tv/" + channel;
      linkText.textContent = "Watch " + channel + " on Twitch";
      dotsEl.querySelectorAll(".stream-dot").forEach((dot, i) => {
        dot.classList.toggle("active", i === index);
      });
    }

    document.getElementById("stream-prev").addEventListener("click", () => {
      index = (index - 1 + CHANNELS.length) % CHANNELS.length;
      render();
    });
    document.getElementById("stream-next").addEventListener("click", () => {
      index = (index + 1) % CHANNELS.length;
      render();
    });

    render();
  </script>
</body>
</html>
