<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Allies and creators SteamPirateTJ likes. Go give them a follow!">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Allies | SteamPirateTJ">
  <meta property="og:description" content="Allies and creators SteamPirateTJ likes. Go give them a follow!">
  <meta property="og:image" content="https://steampiratetj.github.io/SteamPirateTJ/banner.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9A%99%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <title>Allies | SteamPirateTJ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">SteamPirateTJ</a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-links"><i class="fas fa-bars"></i></button>
    <div class="nav-links" id="nav-links">
      <a href="index.html">Home</a>
      <a href="merch.html">Merch</a>
      <a href="gallery.html">Art</a>
      <a href="stream.html">Stream</a>
      <a href="creators.html" class="active">Allies</a>
    </div>
  </nav>

  <section class="section page-section">
    <h2>Allies & Creators I Like</h2>
    <p class="section-desc">Fellow Scallywags That I Care About</p>

    <div class="ally-grid" id="ally-grid"></div>
    <noscript><p class="section-desc">Turn on JavaScript to see my allies.</p></noscript>
  </section>

  <footer>
    <p>© <span id="year"></span> SteamPirateTJ • Cherenkov Corsair</p>
    <p>Built with gears, steam & Cherenkov radiation</p>
  </footer>

  <script src="script.js"></script>
  <script>
    // =====================================================
    // ADD OR EDIT ALLIES HERE
    // To add someone: copy one whole { ... }, block, paste it
    // below the last one, and change the details.
    // Leave a link out (or delete the line) if they don't have it.
    // Link names you can use: twitch, x, instagram, tiktok,
    // youtube, discord, kofi, vgen, throne, website
    // =====================================================
    const ALLIES = [
      {
        name: "Lady Nemui",
        role: "",                       // e.g. "Streamer", "Artist" (optional)
        color: "#116C6E",               // their glow color
        image: "Friends/Lady_Nemui.jpg",
        desc: "A wonderful lass who I view as an older sister. I respect her so you all better too!",
        links: {
          twitch: "https://twitch.tv/ladynemui",
          x: "https://x.com/_aguidingstar_",
          instagram: "https://instagram.com/ladynemui",
          tiktok: "https://tiktok.com/@ladynemui",
          youtube: "https://youtube.com/@ladynemui",
          kofi: "https://ko-fi.com/ladynemui",
          vgen: "https://vgen.co/ladynemui",
          throne: "https://throne.com/ladynemui"
        }
      },

      // Example of how to add the next ally (remove the // on each line to use it):
      // {
      //   name: "Name Here",
      //   role: "Streamer",
      //   color: "#c084fc",
      //   image: "Friends/Name_Here.jpg",
      //   desc: "A line about them.",
      //   links: { twitch: "https://twitch.tv/theirname" }
      // },
    ];

    // Icons for each link type (don't change)
    const ICONS = {
      twitch:    { icon: "fab fa-twitch",      label: "Twitch" },
      x:         { icon: "fab fa-x-twitter",   label: "X" },
      instagram: { icon: "fab fa-instagram",   label: "Instagram" },
      tiktok:    { icon: "fab fa-tiktok",      label: "TikTok" },
      youtube:   { icon: "fab fa-youtube",     label: "YouTube" },
      discord:   { icon: "fab fa-discord",     label: "Discord" },
      kofi:      { icon: "fas fa-mug-hot",     label: "Ko-fi" },
      vgen:      { icon: "fas fa-palette",     label: "VGen" },
      throne:    { icon: "fas fa-gift",        label: "Throne" },
      website:   { icon: "fas fa-globe",       label: "Website" }
    };

    const grid = document.getElementById("ally-grid");

    ALLIES.forEach(ally => {
      const card = document.createElement("article");
      card.className = "ally-card";
      card.style.setProperty("--creator-color", ally.color || "#00d4ff");

      const banner = document.createElement("div");
      banner.className = "ally-banner";
      card.appendChild(banner);

      const avatar = document.createElement("div");
      avatar.className = "ally-avatar";
      if (ally.image) {
        const img = document.createElement("img");
        img.src = ally.image;
        img.alt = ally.name;
        img.loading = "lazy";
        avatar.appendChild(img);
      } else {
        avatar.textContent = ally.name.charAt(0).toUpperCase();
      }
      card.appendChild(avatar);

      const name = document.createElement("h3");
      name.textContent = ally.name;
      card.appendChild(name);

      if (ally.role) {
        const role = document.createElement("span");
        role.className = "ally-role";
        role.textContent = ally.role;
        card.appendChild(role);
      }

      const desc = document.createElement("p");
      desc.className = "ally-desc";
      desc.textContent = ally.desc || "";
      card.appendChild(desc);

      const links = document.createElement("div");
      links.className = "ally-links";
      Object.keys(ally.links || {}).forEach(type => {
        const info = ICONS[type];
        if (!info) return;
        const a = document.createElement("a");
        a.href = ally.links[type];
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.title = info.label;
        a.setAttribute("aria-label", ally.name + " on " + info.label);
        a.innerHTML = '<i class="' + info.icon + '"></i>';
        links.appendChild(a);
      });
      card.appendChild(links);

      grid.appendChild(card);
    });
  </script>
</body>
</html>
